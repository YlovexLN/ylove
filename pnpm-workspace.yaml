# 单包仓库也显式声明 packages：pnpm 9/10 把本文件当作 workspace 清单时，
# 缺少该字段会直接报 `packages field missing or empty`（Cloudflare 构建即栽在这一步）。
packages:
  - '.'

allowBuilds:
  esbuild: true
  micromark: true
  sharp: true
  ttf2woff2: true
  workerd: true
# 使用项目本地 store（与 node_modules 现有链接的 store 保持一致）
storeDir: .pnpm-store
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.2'
  - '@astrojs/markdoc@2.0.6'
  - '@astrojs/react@6.0.2'
  - '@astrojs/cloudflare@14.2.1'
  - '@astrojs/netlify@8.2.1'
  - '@astrojs/underscore-redirects@1.0.4'
  - astro@7.2.1
  - '@astrojs/node@11.1.1'
# @edgeone/astro@1.1.5 尚未适配 Astro 7，保留等待官方更新
# 允许 @edgeone/astro 以 Astro 7 作为 peer 依赖，抑制警告（不影响构建）
peerDependencyRules:
  allowedVersions:
    '@edgeone/astro>astro': '^7.0.0'
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
# 修复 CVE-2026-23950：tar@6.1.11（@edgeone/astro 链路 node-pre-gyp）存在任意文件覆盖漏洞，
# 统一强制到已修复版本（与 @astrojs/netlify 链路的 tar@7.5.22 合并去重）
# 注意：本文件的 overrides 只被 pnpm 10+ 读取；Cloudflare Workers Builds 需把
# PNPM_VERSION 设为与本地一致（11.9.0），否则 pnpm 9 会因读不到该覆盖而
# 在 --frozen-lockfile 阶段报 LOCKFILE_CONFIG_MISMATCH。
overrides:
  tar: 7.5.22
