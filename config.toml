# 站点配置 - 修改此处即可更新页面内容

# 名称
name = "YLOVEXLN"

# 网页标题（浏览器标签页标题，不填则使用 name）
site_title = "YLOVEXLN"

# 网页描述（meta description，用于 SEO，不填则使用默认描述）
site_description = "YLOVEXLN 的个人主页与作品集"

# Logo（不填则使用 name）
# logo = ""

# B站 UID - 头像会自动从 B站 获取 https://space.bilibili.com/这里的数字填在下面
# 获取不到会显示空白 24421599
# 可用环境变量 BILIBILI_UID 覆盖
bilibili_uid = 680447

# 默认头像（B站获取失败或未填 UID 时使用）
avatar = ""

# 标题列表（用于 Hero 区域的轮播标题，可设置多个）
titles = [
  "笔锋悬停迟迟不敢点睛",
  "莫听穿林打叶声，一蓑烟雨任平生"
]

# 打字机速度（毫秒/字，数值越大越慢，默认 120）
typewriter_speed = 250

# 背景滚动文字（仅End主题 不填则使用 name）
# background_text = ""

# 页面模式（single=单页只显示Hero+导航+页脚，scroll=可往下滚动展示模块）
# 可用环境变量 PAGE_MODE 覆盖
mode = "scroll"

# 内容来源（strapi=构建时从 Strapi API 拉取，markdown=使用 src/content/ 下预写的 Markdown）
content_source = "markdown"

# Strapi CMS 配置
# url: Strapi API 地址
#   Strapi Cloud: https://你的实例名.strapiapp.com
#   自部署 Docker: https://cms.你的域名.com
#   本地开发: http://127.0.0.1:1337
# token: API Token（可选，Strapi 后台 Settings → API Tokens 创建；留空则匿名访问）
[strapi]
url = "http://127.0.0.1:1337"
token = ""

# 模块开关 - 设为 false 可关闭对应模块
[modules]
profile = false
works = true
posts = false
repository = false
contact = false


# ── 社交链接（可自由添加 / 删除）─────────────────────────
# 每个 [[socials]] 块一个图标，顺序即显示顺序。
# name=名称 url=链接 icon=FontAwesome 图标名（省略时用 name 小写匹配）
# logo=自定义图标图片地址（单色 SVG 最佳，颜色自动跟随主题）
# 图标库：Font Awesome 品牌 https://fontawesome.com/icons?d=brands&m=free
#   常见：github / x / bilibili / youtube / discord / telegram / weixin / qq / steam 等
# 其他平台（爱发电等）：Simple Icons https://cdn.simpleicons.org/{图标名}/{颜色}
#   例：https://cdn.simpleicons.org/afdian/000000
# show_social_icons=是否显示社交图标（false 只显示文字，默认 true）
show_social_icons = true

[[socials]]
name = "GitHub"
url = "https://github.com/YlovexLN/"
icon = "github"

[[socials]]
name = "BiliBili"
url = "https://space.bilibili.com/24421599"
icon = "bilibili"

# [[socials]]
# name = "请我喝奶茶/赞助"
# url = "/sponsor"
# icon = "coffee"


# ── 赞助页面（/sponsor）────────────────────────────────
# 标题
[sponsor]
title = "请我喝杯奶茶"

# 副标题（页面文案，可自由修改）
# 多行字符串（三引号）：换行会真实显示，页面上分成两行
subtitle = """如果我的内容对你有帮助，欢迎赞助支持～
你的支持是我持续创作的动力！"""

# 收款方式：填收款链接 → 页面在浏览器端自动生成纯二维码（无需服务器/命令）
# 收款码解析网站：https://qrcodereader.net/
#           填收款码图片路径 → 直接显示图片（图片优先于链接）

wechat_link = "wxp://f2f0diwT6TgadUhGzIEcgxy7jUDHqmDCW7QIgwz2YC-EA3Y"
alipay_link = "https://qr.alipay.com/fkx18009udaifvmfco7lu2c?0&T=58602-01-16"
wechat_qr = ""
alipay_qr = ""
afdian_url = "https://afdian.com/a/ylove"


# ── 页脚底部信息（CDN / Host / 备案等）──────────────
# show=整行开关（默认 false）
# 每项：label=前缀文字（可空） text=链接文字 url=地址；可加 show=false 单独隐藏
# 备案号独立配置 [footer.icp]，可用环境变量 FOOTER_ICP_SHOW 单独控制
[footer]
show = true

[[footer.items]]
label = "CDN - "
text = "七牛云"
url = "https://www.qiniu.com/"

[[footer.items]]
label = "HOST - "
text = "EdgeOne"
url = "https://edgeone.ai/"

# 备案号（独立配置，FOOTER_ICP_SHOW=false 可单独隐藏）
[footer.icp]
show = false
text = "黔ICP备2025044225号"
url = "http://beian.miit.gov.cn/"