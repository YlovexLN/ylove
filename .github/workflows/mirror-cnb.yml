# 主镜像：GitHub（主仓库）main 有更新时，单向同步到 CNB（镜像）
# 方向：GitHub → CNB（自动）；CNB → GitHub 的反向仅在 CNB 个别开发时手动触发（见 .cnb/web_trigger.yml）
# 依赖仓库 Secret：CNB_GIT_TOKEN（cnb.cool 访问令牌，需 repo-code:rw 权限；用户名固定为 cnb）
name: Mirror to CNB

on:
  push:
    branches: [main]
    tags: ["*"]        # 同步 tag
  workflow_dispatch:   # 手动触发补同步

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    concurrency:
      group: cnb-sync      # 串行化，避免并发推送冲突
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Push main to cnb.cool
        env:
          CNB_GIT_TOKEN: ${{ secrets.CNB_GIT_TOKEN }}
        run: |
          git remote add cnb https://cnb.cool/ylove520/ylove.git
          # 用 HTTP Header 携带令牌，避免令牌出现在 URL / 错误日志中
          git config --local credential.helper ""
          git config --local "http.https://cnb.cool/.extraheader" \
            "Authorization: Basic $(printf 'cnb:%s' "$CNB_GIT_TOKEN" | base64)"

          # 只镜像 main + tags，不做 --prune：
          #  1. 避免误删 CNB 上因“个别情况在 CNB 开发”而存在的本地分支（如 auto/*，带活跃 PR 分支不允许删除导致整次 push 失败）
          #  2. CNB main 保持为 GitHub main 的忠实镜像，CNB 本地开发分支保留原样
          for i in 1 2 3; do
            git push cnb "HEAD:refs/heads/main" "refs/tags/*:refs/tags/*" && exit 0
            echo "推送失败（第 $i 次），5 秒后重试..."
            sleep 5
          done
          exit 1
