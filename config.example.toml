# 站点配置 - 默认模板（复制为 config.toml 后修改）

# 名称 / Logo（Logo 不填则用 name）
name = "你的名字"
# 网页标题（浏览器标签页标题，不填则使用 name）
# site_title = "你的名字 | 个人主页"
# 网页描述（meta description，用于 SEO）
# site_description = "你的名字 的个人主页与作品集"
# logo = ""

# B站 UID（头像自动获取，失败时用下方 avatar；可用环境变量 BILIBILI_UID 覆盖）
bilibili_uid = 0
avatar = ""

# Hero 轮播标题
titles = ["你好，世界", "欢迎来到我的主页"]

# 打字机速度（毫秒/字，默认 120）
typewriter_speed = 120

# 页面模式：single=仅Hero+导航+页脚，scroll=可滚动展示模块（可用环境变量 PAGE_MODE 覆盖）
mode = "scroll"

# 内容来源：strapi=构建时拉取，markdown=使用 src/content/ 下预写内容
content_source = "markdown"

# 个人简介（About 模块）
bio = "你好，我是站点的主人。"

# 统计信息（About 模块，可自由增删）
[[stats]]
label = "项目"
value = "12"

[[stats]]
label = "文章"
value = "8"

# 是否显示社交图标（false 时只显示文字）
show_social_icons = true

# Strapi CMS 配置（本地开发 http://127.0.0.1:1337）
[strapi]
url = "http://127.0.0.1:1337"
token = ""

# 模块开关（false=关闭对应模块）
[modules]
profile = true
works = true
posts = true
repository = true
contact = true

# 社交链接：每个 [[socials]] 一条
#   icon=FontAwesome 图标名；logo=自定义图标图片地址（优先级更高）
#   show=false 单独隐藏该项（默认 true）
#   图标库 https://fontawesome.com/icons?d=brands&m=free
[[socials]]
name = "GitHub"
url = "https://github.com/你的用户名"
icon = "github"

[[socials]]
name = "bilibili"
url = "https://space.bilibili.com/"
icon = "bilibili"

[[socials]]
name = "邮箱"
url = "mailto:you@example.com"
icon = "mail"

# 页脚底部信息：show=显示开关；label=前缀文字 text=链接文字 url=跳转地址
#   每项可加 show=false 单独隐藏；开关可用环境变量覆盖（部署后免改代码）：
#   FOOTER_SHOW（整行）、FOOTER_ICP_SHOW（备案号）
# 备案号独立 [footer.icp]
[footer]
show = true

[[footer.items]]
label = "CDN - "
text = "七牛云"
url = "https://www.qiniu.com/"

[[footer.items]]
label = "HOST - "
text = "你的主机商"
url = "https://example.com/"

# 备案号（独立配置）
[footer.icp]
show = true
text = "黔ICP备2025044225号"
url = "http://beian.miit.gov.cn/"

# ── 服务状态监控（/status）──────────────────────────────
# 字段：enabled 开关 · interval 轮询秒数 · timeout 超时毫秒 · show_hosts 显示目标地址
# 平台环境变量优先：MONITOR_SHOW / MONITOR_TITLE / MONITOR_INTERVAL / MONITOR_TIMEOUT / MONITOR_SHOW_HOSTS
#   MONITOR_TARGETS = JSON 数组，整体覆盖下面的 [[monitor.targets]]
# 每个目标：id / name / type（http | tcp）
#   http：url，可选 expect_status、secure（只认 https）、check_cert（证书天数，仅 Node）
#   tcp ：host、port；host 留空则读环境变量 MONITOR_HOST_<ID>
# 说明：TCP 需服务端 raw socket，ESA 等边缘环境会显示「不支持」；历史存浏览器 48 小时。
#
# ⚠️ 真实节点地址不要写进本文件（仓库公开）。请在部署平台配置 MONITOR_TARGETS，
#    本地调试放 .env（已被 .gitignore 忽略）。下面只保留占位示例。
[monitor]
enabled  = true
title    = "服务可用率"
interval = 60
timeout  = 5000
show_hosts = false

# 占位示例：真实节点用平台环境变量 MONITOR_TARGETS 配置
# [[monitor.targets]]
# id   = "home"
# name = "本站"
# type = "http"
# url  = "https://example.com"
# secure = true
# check_cert = true

